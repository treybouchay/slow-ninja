# DigitalOcean App Platform spec (optional).
# In the DO UI you can "App Spec" → paste/adjust, or:
#   doctl apps create --spec .do/app.yaml
#
# Replace github.repo with your permanent repo (owner/name) after you create it.
name: slow-ninja
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: treybouchay/slow-ninja
      branch: main
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
