# DigitalOcean App Platform spec (Node buildpack — no Docker).
# Paste under App Spec in the DO UI, or:
#   doctl apps create --spec .do/app.yaml
name: slow-ninja
region: nyc
services:
  - name: web
    github:
      repo: treybouchay/slow-ninja
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
